<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 520" width="930" height="520" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect width="930" height="520" fill="#FFFFFF"/>
<text x="34" y="38" font-size="19" font-weight="700" fill="#16191D">Hai kiểu sai khi soi câu vi phạm — Lên Sàn</text>
<text x="34" y="62" font-size="13" fill="#4D545C">Bỏ sót đắt hơn báo nhầm, nên thiết kế nghiêng về báo nhầm: thà gạch nhầm mười câu hơn sót một câu.</text>

<text x="460" y="102" font-size="12.5" font-weight="700" fill="#4D545C" text-anchor="middle">HỆ THỐNG GẠCH CHÂN</text>
<text x="720" y="102" font-size="12.5" font-weight="700" fill="#4D545C" text-anchor="middle">HỆ THỐNG IM LẶNG</text>
<text x="314" y="198" font-size="12.5" font-weight="700" fill="#4D545C" text-anchor="end">CÂU VI PHẠM THẬT</text>
<text x="314" y="348" font-size="12.5" font-weight="700" fill="#4D545C" text-anchor="end">CÂU KHÔNG VI PHẠM</text>

<rect x="330" y="118" width="260" height="150" fill="#F7F8F9" stroke="#DDE0E3" stroke-width="1.5"/>
<text x="346" y="146" font-size="11.5" font-weight="700" fill="#848B93" letter-spacing="0.5">ĐÚNG · BẮT ĐƯỢC</text>
<text x="346" y="172" font-size="13" fill="#4D545C">Người sửa câu trước khi đăng.</text>
<text x="346" y="192" font-size="13" fill="#4D545C">Tin không bị sàn từ chối.</text>

<rect x="590" y="118" width="260" height="150" fill="#FBECEB" stroke="#A3302B" stroke-width="2"/>
<text x="606" y="146" font-size="11.5" font-weight="700" fill="#A3302B" letter-spacing="0.5">BỎ SÓT · TỆ HƠN</text>
<text x="606" y="172" font-size="13" fill="#4D545C">Tin bị sàn từ chối; nặng hơn</text>
<text x="606" y="192" font-size="13" fill="#4D545C">thì gian hàng bị trừ điểm.</text>
<text x="606" y="248" font-size="13" font-weight="700" fill="#A3302B">Chi phí cao: làm lại, mất ngày bán</text>

<rect x="330" y="268" width="260" height="150" fill="#F7F8F9" stroke="#DDE0E3" stroke-width="1.5"/>
<text x="346" y="296" font-size="11.5" font-weight="700" fill="#848B93" letter-spacing="0.5">BÁO NHẦM · CHẤP NHẬN ĐƯỢC</text>
<text x="346" y="322" font-size="13" fill="#4D545C">Người liếc qua rồi bỏ qua.</text>
<text x="346" y="398" font-size="13" font-weight="700" fill="#16191D">Chi phí thấp: vài giây</text>

<rect x="590" y="268" width="260" height="150" fill="#F7F8F9" stroke="#DDE0E3" stroke-width="1.5"/>
<text x="606" y="296" font-size="11.5" font-weight="700" fill="#848B93" letter-spacing="0.5">ĐÚNG · ĐỂ YÊN</text>
<text x="606" y="322" font-size="13" fill="#4D545C">Tin đi bình thường,</text>
<text x="606" y="342" font-size="13" fill="#4D545C">không ai phải làm gì thêm.</text>

<text x="34" y="462" font-size="12.5" fill="#4D545C"><tspan font-weight="700" fill="#16191D">Thiết kế:</tspan> Rule soi độ dài, ký tự và cụm cấm trước; ngưỡng gạch chân đặt thấp để ưu tiên bắt đủ.</text>
<text x="34" y="486" font-size="12.5" fill="#4D545C">Ngành hàng có mức chắc chắn dưới 0,8 bắt buộc hỏi người. Người duyệt luôn là chốt chặn cuối trước khi đăng.</text>
</svg>
